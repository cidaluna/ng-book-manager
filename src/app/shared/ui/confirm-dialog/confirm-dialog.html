<div class="dialog-backdrop" (click)="cancel.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="dialog__actions">
      <button type="button" class="btn btn--ghost" (click)="cancel.emit()">Cancelar</button>
      <button type="button" class="btn btn--danger" (click)="confirm.emit()">Confirmar</button>
    </div>
  </div>
</div>
